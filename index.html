<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RP Market</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <div id="screen-market" class="screen active">
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="🔍 Найти авто, дом, скин...">
        </div>

        <div class="categories">
            <div class="cat-item active" data-cat="all">
                <div class="cat-icon">⊞</div>
                <span>Все</span>
            </div>
            <div class="cat-item" data-cat="Недвижка">
                <div class="cat-icon">🏠</div>
                <span>Недвижка</span>
            </div>
            <div class="cat-item" data-cat="Авто">
                <div class="cat-icon">🚗</div>
                <span>Авто</span>
            </div>
            <div class="cat-item" data-cat="Скины">
                <div class="cat-icon">👕</div>
                <span>Скины</span>
            </div>
        </div>

        <div class="type-filters">
            <div class="pills">
                <button class="pill active" data-type="all">Все</button>
                <button class="pill" data-type="Продам">Продают</button>
                <button class="pill" data-type="Куплю">Купят</button>
            </div>
            <span id="items-count" class="count-text">Найдено: 0</span>
        </div>

        <div id="ads-grid" class="ads-grid"></div>

        <button id="open-create-btn" class="fab-sell">+ Продать</button>
    </div>

    <div id="screen-chats" class="screen">
        <h2>Чаты</h2>
        <div class="chat-list" id="chat-list">
            <div class="chat-item">
                <div class="chat-avatar" style="background: #7b42f6;">🛒</div>
                <div class="chat-info">
                    <div class="chat-top">
                        <strong>RP Market ✔️</strong>
                        <span>Сегодня</span>
                    </div>
                    <p>Добро пожаловать на торговую площадку!</p>
                </div>
            </div>
            <div class="chat-item">
                <div class="chat-avatar" style="background: #2481cc;">🎧</div>
                <div class="chat-info">
                    <div class="chat-top">
                        <strong>Техподдержка</strong>
                        <span>Закреплено</span>
                    </div>
                    <p>Свяжитесь с поддержкой RP Market</p>
                </div>
            </div>
        </div>
    </div>

    <div id="screen-profile" class="screen">
        <h2>Профиль</h2>
        <div class="profile-card">
            <div class="profile-avatar" id="profile-avatar">👤</div>
            <h3 id="profile-name">Игрок</h3>
            <p class="server-badge">СЕРВЕР 08 • Онлайн</p>
        </div>
    </div>

    <div id="item-modal" class="modal">
        <div class="modal-content">
            <button id="close-item-modal" class="back-btn">← Назад</button>
            <div id="modal-img" class="modal-img"></div>
            <span id="modal-type" class="modal-badge">КУПЛЮ</span>
            <h1 id="modal-title">Название</h1>
            <div id="modal-price" class="modal-price">0 ₽</div>
            <div id="modal-meta" class="modal-meta">СЕРВЕР 8 / КАТЕГОРИЯ</div>
            <p id="modal-desc" class="modal-desc">Описание товара</p>
            <div class="modal-actions">
                <button id="modal-fav-btn" class="fav-circle">♡</button>
                <button id="modal-contact-btn" class="primary-btn">Написать продавцу</button>
            </div>
        </div>
    </div>

    <div id="create-modal" class="modal">
        <div class="modal-content">
            <button id="close-create-modal" class="back-btn">← Отмена</button>
            <h2>Новое объявление</h2>
            <select id="new-type" class="input-field">
                <option value="Продам">Продам</option>
                <option value="Куплю">Куплю</option>
            </select>
            <select id="new-cat" class="input-field">
                <option value="Авто">Авто</option>
                <option value="Скины">Скины</option>
                <option value="Недвижка">Недвижка</option>
            </select>
            <input type="text" id="new-title" class="input-field" placeholder="Название (например: BMW M5 F90)">
            <input type="number" id="new-price" class="input-field" placeholder="Цена в ₽ (например: 15000000)">
            <textarea id="new-desc" class="input-field" rows="3" placeholder="Описание (тюнинг, сервер, торг...)"></textarea>
            <button id="submit-ad-btn" class="primary-btn">Опубликовать</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-btn active" data-target="screen-market">
            <span>🛒</span>
            <small>Рынок</small>
        </button>
        <button class="nav-btn" data-target="screen-chats">
            <span>💬</span>
            <small>Чаты</small>
        </button>
        <button class="nav-btn" data-target="screen-profile">
            <span>👤</span>
            <small>Профиль</small>
        </button>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
