<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MT Market</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#130e24;--card:#1f1938;--inp:#272044;--acc:#7b42f6;--txt:#fff;--mut:#9890b5}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--txt);padding:16px 16px 90px}
.screen{display:none}.screen.active{display:block}
.search input{width:100%;background:var(--inp);border:1px solid #352c5c;padding:12px 16px;border-radius:14px;color:#fff;font-size:15px;outline:none}
.cats{display:flex;gap:14px;margin:18px 0;overflow-x:auto}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-width:65px}
.cat-i{width:54px;height:54px;border-radius:18px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:22px}
.cat.active .cat-i{background:var(--acc)}.cat span{font-size:12px;color:var(--mut)}.cat.active span{color:#fff;font-weight:600}
.filters{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.pills{display:flex;gap:8px}
.pill{background:transparent;border:none;color:var(--mut);padding:6px 14px;border-radius:20px;font-size:14px;font-weight:600;cursor:pointer}
.pill.active{background:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border-radius:16px;overflow:hidden;cursor:pointer}
.card-img{height:130px;background:linear-gradient(135deg,#322466,#1b1438);display:flex;align-items:center;justify-content:center;font-size:48px}
.card-b{padding:10px}.card-t{font-size:15px;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-s{font-size:12px;color:#58a6ff;margin-bottom:6px}.card-p{font-size:15px;font-weight:800;color:#f5d061}
.fab{position:fixed;bottom:85px;right:16px;background:var(--acc);color:#fff;border:none;padding:14px 22px;border-radius:25px;font-size:16px;font-weight:700;box-shadow:0 8px 20px rgba(123,66,246,.5);cursor:pointer;z-index:10}
.nav{position:fixed;bottom:12px;left:16px;right:16px;background:rgba(31,25,56,.95);border:1px solid #352c5c;border-radius:24px;display:flex;justify-content:space-around;padding:8px;z-index:20}
.nbtn{background:transparent;border:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;padding:6px 18px;border-radius:18px;cursor:pointer}
.nbtn.active{background:#2d2452;color:#7aa2ff}.nbtn span{font-size:20px}.nbtn small{font-size:11px;margin-top:2px}
.modal{display:none;position:fixed;inset:0;background:var(--bg);z-index:50;padding:16px;overflow-y:auto}.modal.open{display:block}
.back{background:var(--card);border:none;color:#fff;padding:8px 14px;border-radius:12px;font-size:15px;margin-bottom:16px;cursor:pointer}
.m-img{height:200px;background:var(--card);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:80px;margin-bottom:16px}
.pbtn{width:100%;background:var(--acc);color:#fff;border:none;padding:15px;border-radius:16px;font-size:16px;font-weight:700;cursor:pointer}
.inp{width:100%;background:var(--inp);border:1px solid #352c5c;color:#fff;padding:14px;border-radius:14px;margin-bottom:12px;font-size:15px}
.citem{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #241d42;cursor:pointer}
.cav{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}
</style>
</head>
<body>
<div id="s-market" class="screen active">
  <div class="search"><input id="q" placeholder="🔍 Найти авто, дом, скин..."></div>
  <div class="cats">
    <div class="cat active" onclick="setCat('all',this)"><div class="cat-i">⊞</div><span>Все</span></div>
    <div class="cat" onclick="setCat('Недвижка',this)"><div class="cat-i">🏠</div><span>Недвижка</span></div>
    <div class="cat" onclick="setCat('Авто',this)"><div class="cat-i">🚗</div><span>Авто</span></div>
    <div class="cat" onclick="setCat('Скины',this)"><div class="cat-i">👕</div><span>Скины</span></div>
  </div>
  <div class="filters">
    <div class="pills">
      <button class="pill active" onclick="setType('all',this)">Все</button>
      <button class="pill" onclick="setType('Продам',this)">Продажа</button>
      <button class="pill" onclick="setType('Куплю',this)">Покупка</button>
    </div>
    <span id="cnt" style="font-size:13px;color:var(--mut)">Найдено: 0</span>
  </div>
  <div id="grid" class="grid"></div>
  <button class="fab" onclick="openM('m-create')">+ Продать</button>
</div>

<div id="s-chats" class="screen">
  <h2 style="margin-bottom:12px">Чаты</h2>
  <div id="clist"></div>
</div>

<div id="s-profile" class="screen">
  <h2>Профиль</h2>
  <div style="background:var(--card);padding:24px;border-radius:20px;text-align:center;margin-top:16px">
    <div style="width:70px;height:70px;background:var(--acc);border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:32px">👤</div>
    <h3 id="uname">Игрок</h3>
    <p style="color:#58a6ff;font-size:13px;margin-top:6px">СЕРВЕР 08 • Онлайн</p>
  </div>
</div>

<div id="m-item" class="modal">
  <button class="back" onclick="closeM('m-item')">← Назад</button>
  <div id="mi-img" class="m-img"></div>
  <span id="mi-type" style="color:#58a6ff;font-weight:700;font-size:13px"></span>
  <h1 id="mi-title" style="margin-top:4px"></h1>
  <div id="mi-price" style="font-size:26px;font-weight:800;color:#f5d061;margin:8px 0"></div>
  <p id="mi-desc" style="font-size:15px;line-height:1.5;margin-bottom:24px"></p>
  <button id="mi-btn" class="pbtn">Написать продавцу</button>
</div>

<div id="m-create" class="modal">
  <button class="back" onclick="closeM('m-create')">← Отмена</button>
  <h2 style="margin-bottom:14px">Новое объявление</h2>
  <select id="nt" class="inp"><option value="Продам">Продам</option><option value="Куплю">Куплю</option></select>
  <select id="nc" class="inp"><option value="Авто">Авто</option><option value="Скины">Скины</option><option value="Недвижка">Недвижка</option></select>
  <input id="ntitle" class="inp" placeholder="Название (например: BMW M5 F90)">
  <input id="nprice" type="number" class="inp" placeholder="Цена в ₽">
  <textarea id="ndesc" class="inp" rows="3" placeholder="Описание"></textarea>
  <button id="sbtn" class="pbtn" onclick="publish()">Опубликовать</button>
</div>

<div id="m-room" class="modal">
  <div style="display:flex;flex-direction:column;height:90vh">
    <div style="display:flex;align-items:center;gap:12px;border-bottom:1px solid #241d42;padding-bottom:12px">
      <button class="back" style="margin:0" onclick="closeM('m-room')">←</button>
      <strong id="r-title">Чат</strong>
    </div>
    <div id="r-msgs" style="flex:1;overflow-y:auto;padding:16px 0;display:flex;flex-direction:column;gap:10px"></div>
    <div style="display:flex;gap:8px">
      <input id="r-inp" class="inp" style="margin:0" placeholder="Сообщение...">
      <button class="pbtn" style="width:60px" onclick="sendMsg()">➤</button>
    </div>
  </div>
</div>

<nav class="nav">
  <button class="nbtn active" onclick="tab('s-market',this)"><span>🛒</span><small>Рынок</small></button>
  <button class="nbtn" onclick="tab('s-chats',this)"><span>💬</span><small>Чаты</small></button>
  <button class="nbtn" onclick="tab('s-profile',this)"><span>👤</span><small>Профиль</small></button>
</nav>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
if(tg){ tg.ready(); tg.expand(); }

const tgUser = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : null;
let guestId = localStorage.getItem("mt_uid");
if(!guestId){ guestId = "guest_" + Math.floor(Math.random()*1000000); localStorage.setItem("mt_uid", guestId); }

const meId = tgUser ? String(tgUser.id) : guestId;
const meName = tgUser ? tgUser.first_name : "Игрок";
document.getElementById("uname").innerText = meName;

const BASE = "https://" + "zhakfkqqurjlqdthsnhz" + ".supabase.co/rest/v1";
const ADS_URL = BASE + "/ads";
const MSG_URL = BASE + "/messages";
const API_KEY = "sb_publishable_T-9Yrgl3fHMvua82YTvgVw__QWlEzFl";
const HEADERS = { "apikey": API_KEY, "Content-Type": "application/json", "Prefer": "return=representation" };

let ads = [], cat = "all", typ = "all", q = "";
let activeRoom = null, chatTimer = null;

function openM(id){ document.getElementById(id).classList.add("open"); }
function closeM(id){
  document.getElementById(id).classList.remove("open");
  if(id === "m-room" && chatTimer){ clearInterval(chatTimer); chatTimer = null; }
}
function tab(id, el){
  document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".nbtn").forEach(b=>b.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  if(el) el.classList.add("active");
  if(id === "s-chats") loadChats();
}
function setCat(c, el){
  document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));
  el.classList.add("active"); cat = c; renderAds();
}
function setType(t, el){
  document.querySelectorAll(".pill").forEach(x=>x.classList.remove("active"));
  el.classList.add("active"); typ = t; renderAds();
}
document.getElementById("q").oninput = e => { q = e.target.value; renderAds(); };

async function loadAds(){
  document.getElementById("cnt").innerText = "Загрузка...";
  try {
    const res = await fetch(ADS_URL + "?select=*&order=id.desc", { headers: { "apikey": API_KEY } });
    const data = await res.json();
    if(!res.ok) throw new Error(data.message || res.statusText);
    ads = Array.isArray(data) ? data : [];
    renderAds();
  } catch(e) {
    document.getElementById("cnt").innerText = "Ошибка БД";
  }
}

function renderAds(){
  const g = document.getElementById("grid"); g.innerHTML = "";
  const f = ads.filter(a => (cat==="all"||a.category===cat) && (typ==="all"||a.type===typ) && (a.title||"").toLowerCase().includes(q.toLowerCase()));
  document.getElementById("cnt").innerText = "Найдено: " + f.length;
  f.forEach(a => {
    const d = document.createElement("div"); d.className = "card";
    d.innerHTML = `<div class="card-img">${a.icon||"📦"}</div><div class="card-b"><div class="card-t">${a.title}</div><div class="card-s">${a.type} • ${a.category}</div><div class="card-p">${Number(a.price).toLocaleString("ru-RU")} ₽</div></div>`;
    d.onclick = () => {
      document.getElementById("mi-img").innerText = a.icon||"📦";
      document.getElementById("mi-type").innerText = a.type + " • " + a.category + (a.seller_name ? " • Продавец: " + a.seller_name : "");
      document.getElementById("mi-title").innerText = a.title;
      document.getElementById("mi-price").innerText = Number(a.price).toLocaleString("ru-RU") + " ₽";
      document.getElementById("mi-desc").innerText = a.desc || "";
      document.getElementById("mi-btn").onclick = () => {
        closeM("m-item");
        const sellerId = a.seller_id || "support";
        const roomId = "ad_" + a.id + "_" + meId;
        tab("s-chats", document.querySelectorAll(".nbtn")[1]);
        openRoom({ room_id: roomId, ad_title: a.title, other_id: sellerId, other_name: a.seller_name || "Продавец" });
      };
      openM("m-item");
    };
    g.appendChild(d);
  });
}

async function publish(){
  const title = document.getElementById("ntitle").value.trim();
  const price = parseInt(document.getElementById("nprice").value);
  const type = document.getElementById("nt").value;
  const category = document.getElementById("nc").value;
  const desc = document.getElementById("ndesc").value.trim() || "Без описания";
  if(!title || !price) return alert("Укажите название и цену!");

  const btn = document.getElementById("sbtn");
  btn.disabled = true; btn.innerText = "Публикация...";

  try {
    const icons = {"Авто":"🚘","Скины":"🧥","Недвижка":"🏠"};
    const res = await fetch(ADS_URL, {
      method: "POST",
      headers: HEADERS,
      body: JSON.stringify({ title, type, category, price, icon: icons[category], desc, seller_id: meId, seller_name: meName })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.message || JSON.stringify(data));

    closeM("m-create");
    document.getElementById("ntitle").value = "";
    document.getElementById("nprice").value = "";
    document.getElementById("ndesc").value = "";
    await loadAds();
  } catch(e) {
    alert("Ошибка публикации: " + e.message);
  } finally {
    btn.disabled = false; btn.innerText = "Опубликовать";
  }
}

async function loadChats(){
  const l = document.getElementById("clist");
  l.innerHTML = "<p style=\"color:var(--mut);font-size:14px\">Загрузка чатов...</p>";
  try {
    const query = `?or=(sender_id.eq.${encodeURIComponent(meId)},receiver_id.eq.${encodeURIComponent(meId)})&order=id.asc`;
    const res = await fetch(MSG_URL + query, { headers: { "apikey": API_KEY } });
    const rows = await res.json();
    if(!res.ok) throw new Error(rows.message || "Ошибка");

    const rooms = {};
    (Array.isArray(rows) ? rows : []).forEach(m => {
      const otherId = m.sender_id === meId ? m.receiver_id : m.sender_id;
      const otherName = m.sender_id === meId ? (rooms[m.room_id]?.other_name || "Собеседник") : (m.sender_name || "Собеседник");
      rooms[m.room_id] = { room_id: m.room_id, ad_title: m.ad_title || "Сделка", other_id: otherId, other_name: otherName, last: m.text };
    });

    l.innerHTML = "";
    const list = Object.values(rooms).reverse();
    list.push({ room_id: "sup_" + meId, ad_title: "Техподдержка", other_id: "support", other_name: "Поддержка", last: "Задайте вопрос администрации", isSup: true });

    list.forEach(r => {
      const d = document.createElement("div"); d.className = "citem";
      d.innerHTML = `<div class="cav" style="background:${r.isSup?"#2481cc":"#7b42f6"}">${r.isSup?"🎧":"💬"}</div><div style="flex:1"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><strong>${r.ad_title}</strong><span style="font-size:12px;color:var(--mut)">${r.other_name}</span></div><p style="font-size:13px;color:var(--mut)">${r.last}</p></div>`;
      d.onclick = () => openRoom(r);
      l.appendChild(d);
    });
  } catch(e) {
    l.innerHTML = "<p style=\"color:#ff6b6b\">Ошибка загрузки чатов: " + e.message + "</p>";
  }
}

function openRoom(room){
  activeRoom = room;
  document.getElementById("r-title").innerText = room.ad_title;
  openM("m-room");
  loadRoomMessages();
  if(chatTimer) clearInterval(chatTimer);
  chatTimer = setInterval(loadRoomMessages, 3000);
}

async function loadRoomMessages(){
  if(!activeRoom) return;
  try {
    const res = await fetch(MSG_URL + `?room_id=eq.${encodeURIComponent(activeRoom.room_id)}&order=id.asc`, { headers: { "apikey": API_KEY } });
    const rows = await res.json();
    const b = document.getElementById("r-msgs");
    b.innerHTML = "";
    if(!rows || rows.length === 0){
      b.innerHTML = "<p style=\"text-align:center;color:var(--mut);font-size:13px;margin-top:20px\">Напишите первое сообщение продавцу</p>";
      return;
    }
    rows.forEach(m => {
      const isMe = m.sender_id === meId;
      const d = document.createElement("div");
      d.style.cssText = "padding:10px 14px;border-radius:14px;max-width:80%;font-size:15px;" + (isMe ? "background:#7b42f6;align-self:flex-end" : "background:#272044;align-self:flex-start");
      d.innerText = m.text;
      b.appendChild(d);
    });
    b.scrollTop = b.scrollHeight;
  } catch(e) {}
}

async function sendMsg(){
  const i = document.getElementById("r-inp");
  const text = i.value.trim();
  if(!text || !activeRoom) return;
  i.value = "";
  try {
    const res = await fetch(MSG_URL, {
      method: "POST",
      headers: HEADERS,
      body: JSON.stringify({
        room_id: activeRoom.room_id,
        ad_title: activeRoom.ad_title,
        sender_id: meId,
        sender_name: meName,
        receiver_id: activeRoom.other_id || "support",
        text
      })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.message || "Ошибка отправки");
    const rid = activeRoom.other_id;
    if(rid && rid !== "support" && !String(rid).startsWith("guest_")){
      const tUrl = "https://" + "api.telegram.org/bot8762305287:AAEMtoi9MyIMlJXdufEuLwFpIlXDgP5XLwY/sendMessage";
      const msg = "💬 <b>Новое сообщение в MT Market!</b>\n\n📦 <b>Сделка:</b> " + activeRoom.ad_title + "\n👤 <b>От:</b> " + meName + "\n✉️ <b>Текст:</b> " + text;
      fetch(tUrl, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ chat_id: Number(rid), text: msg, parse_mode: "HTML" }) }).catch(()=>{});
    }
    await loadRoomMessages();
    loadChats();
  } catch(e) {
    alert("Не удалось отправить сообщение: " + e.message);
  }
}

loadChats(); loadAds();
</script>
</body>
</html>
